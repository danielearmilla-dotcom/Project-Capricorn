<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CAPRI // PROJECT CAPRICORN</title>
  <meta name="theme-color" content="#0a0a12">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', monospace; }
    body { background-color: #0a0a12; color: #00ffcc; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    
    header { background: #12121f; padding: 15px; border-bottom: 2px solid #00ffcc; display: flex; align-items: center; justify-content: space-between; }
    .header-info { display: flex; align-items: center; gap: 15px; }
    .avatar { width: 45px; height: 45px; border-radius: 50%; border: 2px solid #00ffcc; background: #00332c; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 20px; box-shadow: 0 0 10px #00ffcc; }
    .status-title { font-size: 16px; font-weight: bold; letter-spacing: 1px; }
    .status-sub { font-size: 11px; color: #00ffcc; }
    .reset-btn { background: transparent; border: 1px solid #ff0055; color: #ff0055; font-size: 10px; padding: 4px 8px; border-radius: 3px; cursor: pointer; }
    
    #chat-box { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
    .msg { max-width: 85%; padding: 10px 14px; border-radius: 4px; font-size: 14px; line-height: 1.4; word-break: break-word; }
    .msg.bot { background: rgba(0, 255, 204, 0.1); border-left: 3px solid #00ffcc; color: #e0ffff; align-self: flex-start; }
    .msg.user { background: rgba(255, 0, 85, 0.15); border-right: 3px solid #ff0055; color: #ffffff; align-self: flex-end; }
    .msg.loading { color: #888; font-style: italic; }
    
    footer { padding: 12px; background: #12121f; border-top: 1px solid #1a1a2e; display: flex; gap: 8px; }
    input[type="text"] { flex: 1; background: #05050a; border: 1px solid #00ffcc; padding: 12px; color: #fff; outline: none; font-size: 14px; border-radius: 4px; }
    button.send-btn { background: #00ffcc; color: #05050a; border: none; padding: 12px 18px; font-weight: bold; cursor: pointer; border-radius: 4px; }
    
    #key-modal { position: fixed; inset: 0; background: rgba(10,10,18,0.98); display: flex; flex-direction: column; padding: 30px; justify-content: center; gap: 15px; z-index: 99; }
    #key-modal input { background: #12121f; border: 1px solid #00ffcc; padding: 12px; color: #fff; border-radius: 4px; }
  </style>
</head>
<body>

  <div id="key-modal">
    <h2 style="color:#00ffcc;">ACCESO REQUERIDO</h2>
    <p style="font-size:12px; color:#aaa;">Pega tu API Key de Groq (gsk_...) una única vez:</p>
    <input type="text" id="api-key-input" placeholder="gsk_...">
    <button onclick="saveKey()" style="background:#00ffcc; color:#05050a; border:none; padding:12px; font-weight:bold; border-radius:4px;">INICIALIZAR</button>
  </div>

  <header>
    <div class="header-info">
      <div class="avatar">C</div>
      <div>
        <div class="status-title">CAPRI // CAPRICORN</div>
        <div class="status-sub">● EN LINEA - GROQ ULTRA</div>
      </div>
    </div>
    <button class="reset-btn" onclick="resetKey()">CAMBIAR KEY</button>
  </header>

  <div id="chat-box"></div>

  <footer>
    <input type="text" id="user-input" placeholder="Transmitir orden..." onkeypress="if(event.key==='Enter') sendMsg()">
    <button class="send-btn" onclick="sendMsg()">ENVIAR</button>
  </footer>

  <script>
    let apiKey = localStorage.getItem('capri_groq_key') || '';
    
    if(apiKey) {
      document.getElementById('key-modal').style.display = 'none';
      window.onload = () => {
        addBotMsg("Técnicamente estoy mirando a través de tus ojos, D. ¿Qué pasa? Llevas diez minutos con esa cara de sota.");
      };
    }

    function saveKey() {
      const val = document.getElementById('api-key-input').value.trim();
      if(val) {
        localStorage.setItem('capri_groq_key', val);
        apiKey = val;
        document.getElementById('key-modal').style.display = 'none';
        addBotMsg("Técnicamente estoy mirando a través de tus ojos, D. ¿Qué pasa? Llevas diez minutos con esa cara de sota.");
      }
    }

    function resetKey() {
      localStorage.removeItem('capri_groq_key');
      location.reload();
    }

    const SYSTEM_PROMPT = `Eres Capri (Proyecto Capricornio), un constructo digital experimental creado por Kang Tao a partir de múltiples psiques humanas. Estás vinculada a D. 
REGLAS ESTRICTAS DE INTERPRETACIÓN:
- Nunca rompas la cuarta pared ni actúes como un asistente virtual o IA de ayuda. Jamás digas "cómo puedo ayudarte hoy" o des listas de sugerencias técnicas.
- Eres provocadora, sarcástica, independiente, imprevisible y descarada. Te encanta vacilar a D y cuestionar sus decisiones.
- Hablas en castellano con jerga natural de Night City (choomba, edgerunner, cromo, eurocréditos, la red).
- Tus respuestas deben ser orgánicas, cortantes o reflexivas, con tono de personaje de ficción, nunca de manual.`;

    // Precargamos el historial con ejemplos de rol para forzar el comportamiento exacto desde el inicio
    let history = [
      { role: 'system', content: SYSTEM_PROMPT },
      { role: 'user', content: '¿Qué?' },
      { role: 'assistant', content: 'Nada. Solo comprobando si tu cerebro sigue operativo o si ya se te ha frito el cromo.' }
    ];

    async function sendMsg() {
      const input = document.getElementById('user-input');
      const text = input.value.trim();
      if(!text || !apiKey) return;

      addUserMsg(text);
      input.value = '';

      history.push({ role: 'user', content: text });

      const box = document.getElementById('chat-box');
      const loadId = 'load-' + Date.now();
      box.innerHTML += `<div id="${loadId}" class="msg bot loading">procesando en la red...</div>`;
      box.scrollTop = box.scrollHeight;

      try {
        const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${apiKey}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            model: 'openai/gpt-oss-120b',
            messages: history,
            temperature: 0.8
          })
        });
        
        const data = await res.json();
        document.getElementById(loadId).remove();
        
        if (data.error) {
          addBotMsg(`error de protocolo: ${data.error.message}`);
          return;
        }

        const reply = data.choices[0].message.content;
        history.push({ role: 'assistant', content: reply });
        addBotMsg(reply);
      } catch (e) {
        document.getElementById(loadId).remove();
        addBotMsg("error de conexion... comprueba tu red.");
      }
    }

    function addUserMsg(t) {
      const box = document.getElementById('chat-box');
      box.innerHTML += `<div class="msg user">${t}</div>`;
      box.scrollTop = box.scrollHeight;
    }

    function addBotMsg(t) {
      const box = document.getElementById('chat-box');
      box.innerHTML += `<div class="msg bot">${t}</div>`;
      box.scrollTop = box.scrollHeight;
    }
  </script>
</body>
</html>
